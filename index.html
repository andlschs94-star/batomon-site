<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>바토몬 원향 도감</title>
<style>
:root{--bg:#101318;--panel:#171c24;--panel2:#202733;--text:#f3f5f7;--muted:#9da7b3;--line:#303947;--accent:#7cc8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1d2632 0,#101318 45%,#0d1014 100%);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:20px}.head{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.title{font-size:28px;font-weight:800}.sub{font-size:13px;color:var(--muted);margin-top:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input,.tools select,.tools button{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:0 12px;font-size:14px}.tools input{min-width:240px}.tools button{cursor:pointer}.tools button:hover{background:var(--panel2)}
.status{background:rgba(124,200,255,.08);border:1px solid rgba(124,200,255,.22);padding:10px 12px;border-radius:10px;color:#cfeaff;margin-bottom:16px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px}.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;transition:.18s transform,.18s border-color}.card:hover{transform:translateY(-2px);border-color:#4b586b}.photo{aspect-ratio:1/1;display:block;width:100%;object-fit:cover;background:#252b33}.body{padding:9px}.top{display:flex;gap:7px;align-items:center}.num{font-size:12px;font-weight:800;color:#cbd2dc;background:#0e1217;padding:3px 6px;border-radius:6px}.name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank{font-size:11px;font-weight:800;margin-top:4px;display:inline-block}.normal{border-color:#5e6670}.advanced{border-color:#6c9879}.rare{border-color:#578fb3}.hero{border-color:#9572af}.legend{border-color:#c58a3a}.normal .rank{color:#c6cbd1}.advanced .rank{color:#96d9aa}.rare .rank{color:#86d7ff}.hero .rank{color:#d5a8f3}.legend .rank{color:#ffc56c}
.actions{display:flex;gap:6px;margin-top:8px}.actions button{flex:1;border:1px solid var(--line);background:#202733;color:#fff;border-radius:8px;padding:7px 5px;font-size:12px;cursor:pointer}.actions button:hover{background:#2b3441}.type{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal{width:min(1000px,100%);max-height:92vh;overflow:auto;background:#12171e;border:1px solid #3a4655;border-radius:16px;box-shadow:0 25px 80px rgba(0,0,0,.5)}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.modalhead h2{font-size:18px;margin:0}.close{border:0;background:#232a34;color:#fff;width:34px;height:34px;border-radius:9px;cursor:pointer}.stats{padding:16px}.tabs,.levels{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button,.levels button{border:1px solid var(--line);background:#1a2028;color:#cbd2dc;border-radius:9px;padding:8px 11px;cursor:pointer}.tabs button.on,.levels button.on{background:#2a4459;color:#fff;border-color:#4e8ab3}.statbox{background:#0e1319;border:1px solid var(--line);border-radius:12px;padding:14px}.statrow{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid #252c35}.statrow:last-child{border-bottom:0}.label{color:var(--muted)}.source{margin-top:12px;font-size:12px;color:#95a4b5}
.editor{display:grid;grid-template-columns:1.35fr .85fr;gap:16px;padding:16px}.canvasWrap{background:#0c1015;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:center}.canvasWrap canvas{max-width:100%;height:auto;touch-action:none;background:#20262f;border-radius:8px}.controls{display:flex;flex-direction:column;gap:9px}.controls label{font-size:12px;color:var(--muted)}.controls input[type=file]{width:100%}.controls input[type=range]{width:100%}.controlrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls button{height:38px;border:1px solid var(--line);background:#202733;color:#fff;border-radius:9px;cursor:pointer}.controls .primary{background:#2c5c7c;border-color:#4b87b2}.small{font-size:11px;color:var(--muted)}
.empty{grid-column:1/-1;padding:50px;text-align:center;color:var(--muted)}
@media (max-width:1200px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}@media (max-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.editor{grid-template-columns:1fr}}@media (max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tools input{min-width:0;width:100%}.tools{display:grid;grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="title">바토몬 원향 도감</div><div class="sub">characters.json에서 원향 64마리 사진과 공식 데이터(Balance 22)를 불러옵니다.</div></div>
    <div class="tools">
      <input id="search" placeholder="캐릭터 이름 검색">
      <select id="rank"><option value="">전체 등급</option><option value="일반">일반</option><option value="고급">고급</option><option value="희귀">희귀</option><option value="영웅">영웅</option><option value="전설">전설</option></select>
      <select id="sort"><option value="no">번호순</option><option value="name">이름순</option><option value="rank">등급순</option></select>
      <button id="resetEdits">사진 수정 전체 초기화</button>
    </div>
  </div>
  <div id="status" class="status">characters.json 불러오는 중…</div>
  <div id="grid" class="grid"></div>
</div>

<div id="statsOverlay" class="overlay"><div class="modal"><div class="modalhead"><h2 id="statsTitle">능력치</h2><button class="close" onclick="closeStats()">×</button></div><div class="stats"><div class="tabs" id="modeTabs"></div><div class="levels" id="levelTabs"></div><div class="statbox" id="statContent"></div></div></div></div>

<div id="editOverlay" class="overlay"><div class="modal"><div class="modalhead"><h2 id="editTitle">사진 수정</h2><button class="close" onclick="closeEditor()">×</button></div><div class="editor"><div class="canvasWrap"><canvas id="canvas" width="760" height="580"></canvas></div><div class="controls"><label>새 사진 선택</label><input id="fileInput" type="file" accept="image/*"><label>확대</label><input id="zoom" type="range" min="0.5" max="3" step="0.01" value="1"><div class="controlrow"><div><label>X 위치</label><input id="posX" type="range" min="-500" max="500" step="1" value="0"></div><div><label>Y 위치</label><input id="posY" type="range" min="-500" max="500" step="1" value="0"></div></div><div class="controlrow"><button onclick="fitImage()">원래 맞춤</button><button onclick="centerImage()">가운데</button></div><div class="controlrow"><button onclick="rotate(-90)">↶ 90°</button><button onclick="rotate(90)">↷ 90°</button></div><button class="primary" onclick="saveEditor()">수정 사진 저장</button><button onclick="resetPhoto()">이 캐릭터 원본으로 복원</button><button onclick="removeCustom()">저장된 수정본 삭제</button><button onclick="downloadEdited()">현재 사진 JPG 저장</button><div id="editStatus" class="small"></div></div></div></div></div>

<script>
'use strict';
let characters=[];
let statsCurrent=null;
let statsMode='normal';
let statsLevel=1;
let currentNo=null;
let edits={};
let work=null;
let baseImg=null;
let dragging=false;
let dragStart={x:0,y:0,ox:0,oy:0};
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

function rankClass(rank){return ({'一般':'normal','고급':'advanced','희귀':'rare','영웅':'hero','전설':'legend'})[rank]||''}
function getItem(no){return characters.find(x=>Number(x.no)===Number(no))}
function currentSrc(no){const c=edits[String(no)]; return c?.src || getItem(no)?.src || '';}
function loadEdits(){try{edits=JSON.parse(localStorage.getItem('batomon-photo-edits-v2')||'{}')||{};}catch{edits={}}}
function saveEdits(){try{localStorage.setItem('batomon-photo-edits-v2',JSON.stringify(edits));}catch{document.getElementById('status').textContent='브라우저 저장공간이 부족해 사진 수정 저장에 실패했습니다.';}}
function safe(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function render(){
  const g=document.getElementById('grid');
  const q=document.getElementById('search').value.trim().toLowerCase();
  const rf=document.getElementById('rank').value;
  const sort=document.getElementById('sort').value;
  let list=characters.filter(c=>(!q||String(c.name).toLowerCase().includes(q))&&(!rf||c.rank===rf));
  list.sort((a,b)=>sort==='name'?String(a.name).localeCompare(String(b.name),'ko'):sort==='rank'?(rankOrder(a.rank)-rankOrder(b.rank)||a.no-b.no):a.no-b.no);
  g.innerHTML='';
  if(!list.length){g.innerHTML='<div class="empty">조건에 맞는 캐릭터가 없습니다.</div>';return;}
  for(const item of list){
    const c=document.createElement('div'); c.className='card '+rankClass(item.rank);
    const img=document.createElement('img'); img.className='photo'; img.src=currentSrc(item.no); img.alt=item.name; img.loading='lazy';
    const body=document.createElement('div'); body.className='body';
    const top=document.createElement('div'); top.className='top';
    const n=document.createElement('span'); n.className='num'; n.textContent=String(item.no).padStart(2,'0');
    const nm=document.createElement('span'); nm.className='name'; nm.textContent=item.name;
    top.append(n,nm);
    const r=document.createElement('div'); r.className='rank'; r.textContent=item.rank||'';
    const t=document.createElement('div'); t.className='type'; t.textContent=item.type||'';
    const act=document.createElement('div'); act.className='actions';
    const sb=document.createElement('button'); sb.textContent='능력치 보기'; sb.onclick=()=>openStats(item.no);
    const eb=document.createElement('button'); eb.textContent='✎ 사진 수정'; eb.onclick=()=>openEditor(item.no);
    act.append(sb,eb); body.append(top,r,t,act); c.append(img,body); g.appendChild(c);
  }
  document.getElementById('status').textContent=`총 ${characters.length}마리 · 현재 표시 ${list.length}마리`;
}
function rankOrder(r){return ({'일반':1,'고급':2,'희귀':3,'영웅':4,'전설':5})[r]||99}

function openStats(no){
  const item=getItem(no); if(!item)return; statsCurrent=item; statsMode='normal'; statsLevel=1; document.getElementById('statsTitle').textContent=`${String(item.no).padStart(2,'0')}번 ${item.name} · 능력치`; drawStats(); document.getElementById('statsOverlay').style.display='flex';
}
function drawStats(){
  if(!statsCurrent)return;
  const modes=[['normal','일반'],['shiny','SHINY']];
  const mt=document.getElementById('modeTabs'); mt.innerHTML='';
  for(const [key,label] of modes){const b=document.createElement('button');b.textContent=label;b.className=statsMode===key?'on':'';b.onclick=()=>{statsMode=key;drawStats()};mt.appendChild(b)}
  const lt=document.getElementById('levelTabs'); lt.innerHTML='';
  for(let lv=1;lv<=4;lv++){const b=document.createElement('button');b.textContent=`Lv${lv}`;b.className=statsLevel===lv?'on':'';b.onclick=()=>{statsLevel=lv;drawStats()};lt.appendChild(b)}
  const arr=statsMode==='normal'?(statsCurrent.levels||[]):(statsCurrent.shinyLevels||[]);
  const d=arr.find(x=>Number(x.level)===statsLevel)||{};
  const box=document.getElementById('statContent'); box.innerHTML='';
  const rows=[
    ['공식 이름',statsCurrent.officialName||'미입력'],
    ['커스텀 등급',statsCurrent.rank||'미입력'],
    ['공식 등급',statsCurrent.officialRarity||'미입력'],
    ['속성',statsCurrent.type||'미입력'],
    ['가격',statsCurrent.price==null?'미입력':`$${statsCurrent.price}`],
    ['피해',d.damage==null?'—':d.damage],
    ['회복',d.heal==null?'—':d.heal],
    ['실드',d.shield==null?'—':d.shield],
    ['화상',d.burn==null?'—':d.burn],
    ['독',d.poison==null?'—':d.poison],
    ['전격',d.shock==null?'—':d.shock],
    ['멀티캐스트',d.multicast==null?'—':`×${d.multicast}`],
    ['재사용',d.cooldown==null?'—':`${d.cooldown}초`],
    ['능력',d.ability||'없음']
  ];
  for(const [l,v] of rows){const row=document.createElement('div');row.className='statrow';const a=document.createElement('div');a.className='label';a.textContent=l;const b=document.createElement('div');b.textContent=String(v);row.append(a,b);box.appendChild(row)}
  const s=document.createElement('div');s.className='source';s.innerHTML=`출처: <a href="${safe(d.source||statsCurrent.officialUrl||'https://batomon.com')}" target="_blank" rel="noopener noreferrer">batomon.com</a>`;box.appendChild(s);
}
function closeStats(){document.getElementById('statsOverlay').style.display='none';statsCurrent=null}

function openEditor(no){
  const item=getItem(no); if(!item)return; currentNo=no; document.getElementById('editTitle').textContent=`사진 수정 · ${String(no).padStart(2,'0')}번 ${item.name}`;
  const saved=edits[String(no)]; work=saved?{...saved}:{src:item.src,x:0,y:0,zoom:1,rotation:0};
  document.getElementById('zoom').value=work.zoom;document.getElementById('posX').value=work.x;document.getElementById('posY').value=work.y;document.getElementById('editStatus').textContent='캔버스를 드래그해서 위치를 조정할 수 있습니다.';
  loadEditorImage(work.src); document.getElementById('editOverlay').style.display='flex';
}
function loadEditorImage(src){baseImg=new Image();baseImg.onload=()=>drawEditor();baseImg.src=src}
function drawEditor(){
  ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#20262f';ctx.fillRect(0,0,canvas.width,canvas.height);if(!baseImg||!baseImg.complete)return;
  const fit=Math.min(canvas.width/baseImg.width,canvas.height/baseImg.height),scale=fit*Number(work.zoom||1);ctx.save();ctx.translate(canvas.width/2+Number(work.x||0),canvas.height/2+Number(work.y||0));ctx.rotate(Number(work.rotation||0)*Math.PI/180);ctx.drawImage(baseImg,-baseImg.width*scale/2,-baseImg.height*scale/2,baseImg.width*scale,baseImg.height*scale);ctx.restore();
}
function fitImage(){work.zoom=1;work.x=0;work.y=0;document.getElementById('zoom').value=1;document.getElementById('posX').value=0;document.getElementById('posY').value=0;drawEditor()}
function centerImage(){work.x=0;work.y=0;document.getElementById('posX').value=0;document.getElementById('posY').value=0;drawEditor()}
function rotate(d){work.rotation=(Number(work.rotation||0)+d)%360;drawEditor()}
function resetPhoto(){const item=getItem(currentNo);if(!item)return;work={src:item.src,x:0,y:0,zoom:1,rotation:0};document.getElementById('zoom').value=1;document.getElementById('posX').value=0;document.getElementById('posY').value=0;loadEditorImage(work.src);document.getElementById('editStatus').textContent='원본으로 되돌렸습니다. 저장하려면 "수정 사진 저장"을 눌러주세요.'}
function removeCustom(){if(currentNo==null)return;delete edits[String(currentNo)];saveEdits();render();openEditor(currentNo);document.getElementById('editStatus').textContent='저장된 수정본을 삭제했습니다.'}
function saveEditor(){if(currentNo==null)return;edits[String(currentNo)]={...work};saveEdits();render();document.getElementById('editStatus').textContent='수정 사진을 이 브라우저에 저장했습니다.'}
function downloadEdited(){
  if(!baseImg)return;const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const ox=out.getContext('2d');ox.fillStyle='#20262f';ox.fillRect(0,0,out.width,out.height);const fit=Math.min(out.width/baseImg.width,out.height/baseImg.height),scale=fit*Number(work.zoom||1);ox.save();ox.translate(out.width/2+Number(work.x||0),out.height/2+Number(work.y||0));ox.rotate(Number(work.rotation||0)*Math.PI/180);ox.drawImage(baseImg,-baseImg.width*scale/2,-baseImg.height*scale/2,baseImg.width*scale,baseImg.height*scale);ox.restore();out.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`batomon_${String(currentNo).padStart(2,'0')}_edited.jpg`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/jpeg',.95)
}
function closeEditor(){document.getElementById('editOverlay').style.display='none';currentNo=null;baseImg=null}

document.getElementById('fileInput').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{work={src:rd.result,x:0,y:0,zoom:1,rotation:0};document.getElementById('zoom').value=1;document.getElementById('posX').value=0;document.getElementById('posY').value=0;loadEditorImage(work.src)};rd.readAsDataURL(f)});
document.getElementById('zoom').addEventListener('input',e=>{work.zoom=Number(e.target.value);drawEditor()});document.getElementById('posX').addEventListener('input',e=>{work.x=Number(e.target.value);drawEditor()});document.getElementById('posY').addEventListener('input',e=>{work.y=Number(e.target.value);drawEditor()});
canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.setPointerCapture(e.pointerId);dragStart={x:e.clientX,y:e.clientY,ox:Number(work.x||0),oy:Number(work.y||0)}});canvas.addEventListener('pointermove',e=>{if(!dragging)return;const r=canvas.getBoundingClientRect();work.x=Math.max(-500,Math.min(500,dragStart.ox+(e.clientX-dragStart.x)*canvas.width/r.width));work.y=Math.max(-500,Math.min(500,dragStart.oy+(e.clientY-dragStart.y)*canvas.height/r.height));document.getElementById('posX').value=work.x;document.getElementById('posY').value=work.y;drawEditor()});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
for(const id of ['statsOverlay','editOverlay'])document.getElementById(id).addEventListener('click',e=>{if(e.target.id===id){id==='statsOverlay'?closeStats():closeEditor()}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('editOverlay').style.display==='flex')closeEditor();else if(document.getElementById('statsOverlay').style.display==='flex')closeStats()}});

document.getElementById('search').addEventListener('input',render);document.getElementById('rank').addEventListener('change',render);document.getElementById('sort').addEventListener('change',render);document.getElementById('resetEdits').addEventListener('click',()=>{if(!confirm('모든 사진 수정 내용을 이 브라우저에서 삭제할까요?'))return;edits={};saveEdits();render()});

async function init(){
  loadEdits();
  try{
    const res=await fetch('./characters.json?cb='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();characters=Array.isArray(data)?data:(data.characters||[]);
    if(characters.length===0)throw new Error('characters 배열이 비어 있습니다.');
    document.getElementById('status').textContent=`데이터 로드 완료 · 원향 ${characters.length}마리 · 공식 데이터 적용`;
    render();
  }catch(err){
    console.error(err);document.getElementById('status').textContent='characters.json을 불러오지 못했습니다. index.html과 characters.json이 같은 GitHub 폴더에 있는지 확인하세요.';
    document.getElementById('grid').innerHTML='<div class="empty">데이터 파일을 찾을 수 없습니다.<br><br><b>GitHub에 index.html과 characters.json을 같은 폴더에 올려주세요.</b></div>';
  }
}
init();
</script>
</body>
</html>
