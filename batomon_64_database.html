<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batomon 1~64 데이터베이스</title>
<style>
body{margin:0;background:#0d1117;color:#e8edf3;font-family:Arial,"Malgun Gothic",sans-serif}
header{padding:18px;border-bottom:1px solid #303846;background:#151b24;position:sticky;top:0;z-index:5}
h1{margin:0 0 5px;font-size:22px}.sub{color:#98a1ae;font-size:12px}
.wrap{max-width:1400px;margin:auto;padding:16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select{background:#111820;color:#fff;border:1px solid #394657;border-radius:7px;padding:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:#151b24;border:1px solid #303846;border-radius:10px;padding:12px}
.card.ok{border-color:#4c755a}.no{font-size:11px;color:#8490a0}.name{font-weight:700;font-size:16px;margin:3px 0 8px}
.tag{display:inline-block;padding:3px 6px;border:1px solid #465367;border-radius:999px;font-size:10px;margin:2px}
.row{display:grid;grid-template-columns:90px 1fr;gap:8px;font-size:11px;padding:5px 0;border-bottom:1px solid #252e39}
.k{color:#8792a1}.v{color:#e3e8ef}.missing{color:#d49b6a}
a{color:#8eb8ff;text-decoration:none}
</style></head>
<body>
<header><h1>Batomon · 원향 1~64 데이터베이스</h1>
<div class="sub">현재 batomon.com Balance 22 / Steam build 25377295 기준 · 검증된 데이터만 수치 입력</div></header>
<div class="wrap">
<div class="tools">
<input id="q" placeholder="이름 검색">
<select id="filter"><option value="all">전체 64</option><option value="verified">검증 완료</option><option value="pending">미검증</option></select>
</div>
<div id="grid" class="grid"></div>
</div>
<script>
let DB=null;
fetch("batomon_64_characters.json").then(r=>r.json()).then(x=>{DB=x;render()});
function render(){
 const q=document.getElementById("q").value.toLowerCase(), f=document.getElementById("filter").value;
 const arr=DB.characters.filter(c=>{
   const hit=(c.name_ko+(c.name_en||"")).toLowerCase().includes(q);
   const ok=f==="all"||(f==="verified"&&c.verified)||(f==="pending"&&!c.verified);
   return hit&&ok;
 });
 document.getElementById("grid").innerHTML=arr.map(c=>{
   const l=c.levels["1"];
   const stat=[
    ["등급",c.rarity||"미확인"],
    ["타입",c.type.length?c.type.join(" / "):"미확인"],
    ["Lv1 Damage",l.damage??"미확인"],
    ["Poison",l.poison??"미확인"],
    ["Burn",l.burn??"미확인"],
    ["Shock",l.shock??"미확인"],
    ["Heal",l.heal??"미확인"],
    ["Shield",l.shield??"미확인"],
    ["Cooldown",l.cooldown!=null?l.cooldown+"s":"미확인"],
    ["능력",l.ability||"미확인"]
   ];
   return `<div class="card ${c.verified?"ok":""}">
    <div class="no">#${String(c.no).padStart(2,"0")} · ${c.verified?"검증 완료":"데이터 확인 필요"}</div>
    <div class="name">${c.name_ko}${c.name_en?` <span class="tag">${c.name_en}</span>`:""}</div>
    ${stat.map(s=>`<div class="row"><div class="k">${s[0]}</div><div class="v ${s[1]==="미확인"?"missing":""}">${s[1]}</div></div>`).join("")}
    ${c.source_url?`<div style="margin-top:8px"><a target="_blank" href="${c.source_url}">batomon.com 원본</a></div>`:""}
   </div>`
 }).join("");
}
q.oninput=render;filter.onchange=render;
</script>
</body></html>
