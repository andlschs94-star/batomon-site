      return `<div class="stat">${l}<b>${esc(v)}${k==="cooldown"?"s":""}</b></div>`;
    }).join("");
    const ability=d.ability ? `<div class="ability">${esc(d.ability)}</div>` : "";
    const verified=Object.entries(d).some(([k,v])=>k!=="source_note"&&v!==null&&v!==undefined);
    return `<article class="card">
      <h2>${esc(c.no)}. ${esc(c.name_ko)}</h2>
      <div class="meta">${esc(c.name_en||"")} · ${esc(c.rarity||"")} · ${(c.type||[]).map(esc).join(" / ")}</div>
      <span class="badge">Lv ${document.getElementById("lv").value}</span>
      <span class="badge">${document.getElementById("mode").value==="shiny"?"Shiny":"일반"}</span>
      <span class="badge">${verified?"확인":"미확인"}</span>
      <div class="stats">${statHtml}</div>${ability}
      <a class="source" target="_blank" href="${esc(c.source_url||"https://batomon.com")}">Batomon.com 원문 보기 →</a>
    </article>`;
  }).join("");
}
["q","status","lv","mode"].forEach(id=>document.getElementById(id).addEventListener("input",render));
render();
</script>
</body>
</html>
